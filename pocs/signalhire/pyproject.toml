[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signalhire"
version = "0.1.0"
description = "Application authenticity engine — labels applications as genuine effort / mass-generated / needs review with explainable reason codes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PyMuPDF>=1.24",
    "pikepdf>=8.0",
    "datasketch>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
web = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]

[project.scripts]
signalhire = "signalhire.cli:main"

[tool.setuptools.packages.find]
include = ["signalhire*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
