<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Watch it in IMAX</title>
<meta name="description" content="Paste a movie trailer and watch it fill the screen the way IMAX does — see how much picture a normal screen hides from you." />
<meta name="theme-color" content="#08090c" />
<meta property="og:title" content="Watch it in IMAX" />
<meta property="og:description" content="Paste a trailer and see how much more picture IMAX shows you." />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2308090c'/%3E%3Crect x='5' y='7' width='22' height='18' rx='2' fill='%2335a7ff'/%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #08090c;
    --ink: #f0f2f8;
    --dim: #9aa0b2;
    --accent: #35a7ff;
    --gold: #f0b64a;
    --chip: #14161d;
    --chip-edge: #2a2f3c;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(130% 90% at 50% 0%, #0e1017 0%, var(--bg) 62%);
    color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }

  header { text-align: center; padding: 0.6rem 1rem 0.15rem; }
  header h1 {
    font-size: 1.1rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-weight: 800;
  }
  header h1 span { color: var(--accent); }
  header p { color: var(--dim); font-size: 0.88rem; margin-top: 0.1rem; }

  /* ---------- the screen ---------- */
  #stage {
    flex: 1;
    min-height: 0;
    display: grid;
    place-items: center;
    padding: 0.55rem 1.2rem;
    position: relative;
  }
  #frame {
    position: relative;
    overflow: hidden;
    background: #000;
    border-radius: 6px;
    box-shadow:
      0 0 0 1px #20242e,
      0 0 70px rgba(53, 167, 255, 0.12),
      0 34px 90px rgba(0, 0, 0, 0.7);
    transition: width 0.7s cubic-bezier(0.22, 1, 0.3, 1),
                height 0.7s cubic-bezier(0.22, 1, 0.3, 1);
  }
  #scene {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  /* user media + trailers are centred and oversized so bars clip away */
  #frame > img, #frame > video, #frame > iframe {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border: 0;
    display: block;
    transition: width 0.7s cubic-bezier(0.22, 1, 0.3, 1),
                height 0.7s cubic-bezier(0.22, 1, 0.3, 1);
  }
  /* The player stays clickable: when a browser blocks autoplay, YouTube's own
     play button is the only way to start, so it must be reachable. */
  #frame > iframe { pointer-events: auto; }

  /* our own start button, shown when playback hasn't begun by itself */
  #tap {
    position: absolute;
    inset: 0;
    display: none;
    place-items: center;
    background: rgba(4, 6, 10, 0.35);
  }
  #tap.show { display: grid; }
  #tap button {
    background: linear-gradient(180deg, #3fb0ff 0%, #2b8fe6 100%);
    color: #04121f;
    border: none;
    border-radius: 999px;
    padding: 0.7rem 1.8rem;
    font: inherit;
    font-weight: 800;
    font-size: 1.05rem;
    cursor: pointer;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
  }

  /* what a normal cinema cuts off */
  .missband {
    position: absolute;
    left: 0; right: 0;
    background: rgba(4, 6, 10, 0.72);
    opacity: 0;
    transition: opacity 0.35s, height 0.7s cubic-bezier(0.22, 1, 0.3, 1);
    pointer-events: none;
    overflow: hidden;
  }
  .missband.on { opacity: 1; }
  .missband.top { top: 0; border-bottom: 1px dashed rgba(240, 182, 74, 0.85); }
  .missband.bottom { bottom: 0; border-top: 1px dashed rgba(240, 182, 74, 0.85); }
  .missband span {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    color: var(--gold);
    font-size: clamp(0.6rem, 1.5vw, 0.8rem);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .missband.top span { bottom: 4px; }
  .missband.bottom span { top: 4px; }

  #flash {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.45s;
    text-align: center;
    padding: 1rem;
    text-shadow: 0 2px 20px rgba(0, 0, 0, 0.95);
  }
  #flash.show { opacity: 1; }
  #flash strong { font-size: clamp(1.7rem, 5vw, 3.4rem); letter-spacing: 0.05em; display: block; font-weight: 800; }
  #flash small { color: #dfe5f2; font-size: clamp(0.8rem, 1.8vw, 1.05rem); }

  /* shown when a trailer refuses to play here */
  #notice {
    position: absolute;
    inset: 0;
    display: none;
    place-items: center;
    text-align: center;
    padding: 1.2rem;
    background: rgba(4, 6, 10, 0.86);
  }
  #notice.show { display: grid; }
  #notice p { max-width: 30rem; margin-bottom: 0.8rem; }
  #notice a { color: var(--accent); }
  #noticeClose {
    position: absolute;
    top: 0.5rem;
    right: 0.7rem;
    background: none;
    border: none;
    color: var(--dim);
    font: inherit;
    font-size: 1.3rem;
    line-height: 1;
    cursor: pointer;
    padding: 0.3rem 0.5rem;
  }
  #noticeClose:hover { color: var(--ink); }

  /* ---------- controls ---------- */
  #controls {
    padding: 0.35rem 1rem 0.85rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.45rem;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    flex-wrap: wrap;
    width: 100%;
    max-width: 940px;
  }

  button.btn {
    background: var(--chip);
    color: var(--ink);
    border: 1px solid var(--chip-edge);
    border-radius: 999px;
    padding: 0.4rem 0.95rem;
    font: inherit;
    font-size: 0.88rem;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
    white-space: nowrap;
  }
  button.btn:hover { border-color: var(--accent); }
  button.btn:active { transform: scale(0.97); }
  button.btn.on {
    background: color-mix(in srgb, var(--accent) 22%, var(--chip));
    border-color: var(--accent);
  }
  button.btn.film { font-size: 0.84rem; padding: 0.34rem 0.8rem; }
  button.btn.film.on { background: color-mix(in srgb, var(--gold) 20%, var(--chip)); border-color: var(--gold); }
  button.btn b { font-weight: 700; }

  button.hero {
    background: linear-gradient(180deg, #3fb0ff 0%, #2b8fe6 100%);
    color: #04121f;
    border: none;
    border-radius: 999px;
    padding: 0.55rem 1.5rem;
    font: inherit;
    font-weight: 800;
    font-size: 1rem;
    cursor: pointer;
    box-shadow: 0 6px 22px rgba(53, 167, 255, 0.35);
    transition: transform 0.1s, box-shadow 0.15s;
  }
  button.hero:hover { box-shadow: 0 8px 30px rgba(53, 167, 255, 0.5); }
  button.hero:active { transform: scale(0.97); }

  #ytUrl {
    background: var(--chip);
    color: var(--ink);
    border: 1px solid var(--chip-edge);
    border-radius: 999px;
    padding: 0.45rem 1.1rem;
    font: inherit;
    font-size: 0.9rem;
    flex: 1;
    min-width: 12rem;
    max-width: 30rem;
  }
  #ytUrl:focus { outline: none; border-color: var(--accent); }
  #ytUrl::placeholder { color: var(--dim); }

  .label { color: var(--dim); font-size: 0.76rem; letter-spacing: 0.05em; }
  #caption { color: var(--dim); font-size: 0.85rem; text-align: center; min-height: 1.2em; padding: 0 1rem; }
  #caption b { color: var(--gold); }
  .textlink {
    background: none; border: none; color: var(--dim); cursor: pointer;
    font: inherit; font-size: 0.82rem; text-decoration: underline; padding: 0.2rem;
  }
  .textlink:hover { color: var(--ink); }
  input[type="file"] { display: none; }

  @media (max-width: 700px) {
    header { padding: 0.45rem 1rem 0.1rem; }
    header p { display: none; }
    #stage { padding: 0.35rem 0.5rem; }
    #controls { gap: 0.3rem; padding: 0.3rem 0 0.6rem; }
    button.btn { padding: 0.34rem 0.7rem; font-size: 0.82rem; }
    .label { display: none; }
    /* one swipeable line each instead of four wrapped rows, so the picture
       keeps the height it deserves on a phone */
    .row.scroll {
      flex-wrap: nowrap;
      overflow-x: auto;
      justify-content: flex-start;
      scrollbar-width: none;
      padding: 0 0.5rem;
      scroll-padding: 0.5rem;
    }
    .row.scroll::-webkit-scrollbar { display: none; }
    .row.scroll > * { flex: 0 0 auto; }
    #caption { font-size: 0.8rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    #frame, #frame > img, #frame > video, #frame > iframe, .missband { transition: none; }
  }
</style>
</head>
<body>
  <header>
    <h1>Watch it in <span>IMAX</span></h1>
    <p>Paste a movie trailer and see it fill the screen, the way IMAX does</p>
  </header>

  <div id="stage">
    <div id="frame">
      <canvas id="scene"></canvas>
      <div class="missband top" id="missTop"><span>a normal cinema cuts this off</span></div>
      <div class="missband bottom" id="missBottom"><span>and this</span></div>
      <div id="tap"><button type="button" id="tapBtn">▶ Tap to play</button></div>
      <div id="flash"></div>
      <div id="notice">
        <button type="button" id="noticeClose" aria-label="Close">×</button>
        <div>
          <p id="noticeText"></p>
          <a id="noticeLink" href="#" target="_blank" rel="noopener">Open it on YouTube instead ↗</a>
        </div>
      </div>
    </div>
  </div>

  <div id="controls">
    <div class="row">
      <input id="ytUrl" type="url" placeholder="Paste a YouTube trailer link here…" />
      <button class="btn" id="ytBtn">Play</button>
      <button class="textlink" id="mediaBtn">or use your own video</button>
      <input type="file" id="mediaInput" accept="image/*,video/*" />
    </div>

    <div class="row scroll">
      <button class="hero" id="imaxBtn">Watch it in IMAX</button>
      <button class="btn" id="fsBtn">Full screen</button>
      <button class="btn" id="soundBtn">Sound off</button>
      <button class="btn" id="missBtn">Show what you'd miss</button>
      <button class="btn" id="trimBtn">Trim black bars</button>
      <button class="btn" id="shareBtn">Copy link</button>
    </div>

    <div class="row scroll" id="sizeRow">
      <span class="label">Screen size</span>
    </div>

    <div class="row scroll" id="filmRow">
      <span class="label">Famous IMAX films</span>
    </div>

    <div id="caption"></div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
