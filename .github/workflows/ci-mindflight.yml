name: mindflight CI

on:
  push:
    branches: [master]
    paths:
      - "pocs/mindflight/**"
      - ".github/workflows/ci-mindflight.yml"
  pull_request:
    paths:
      - "pocs/mindflight/**"
      - ".github/workflows/ci-mindflight.yml"

defaults:
  run:
    working-directory: pocs/mindflight

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m mindflight demo | tail -5
